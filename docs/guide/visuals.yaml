# Capture recipe for the debaser guide's captured visuals (cc-guide,
# specs/008-captured-visuals). `make visuals-image` builds the tool image
# first; `make visuals` captures. All seed data is fictional (example/widget).
schema: 1

defaults:
  width: 100
  prompt: "$ "

# Every environment runs the same image and seed script; the mode decides the
# state of the fictional project example/widget. The image's working directory
# is the clone /work/widget, so every command runs there.
environments:
  widget:
    kind: cli
    image: localhost/debaser-visuals:0.1.0
    source: debaser
    seed:
      - run: sh /visuals/seed/widget.sh built
        files: [seed/widget.sh]
  widget-build:
    kind: cli
    image: localhost/debaser-visuals:0.1.0
    source: debaser
    seed:
      - run: sh /visuals/seed/widget.sh fresh
        files: [seed/widget.sh]
  widget-conflict:
    kind: cli
    image: localhost/debaser-visuals:0.1.0
    source: debaser
    seed:
      - run: sh /visuals/seed/widget.sh conflict
        files: [seed/widget.sh]

visuals:
  # The card's timeline bar splits about 70 cells by stage time
  # (debaser:src/live/render.ts:794-802). The seed's fixed step times keep verify
  # at about 5 of 5.4 seconds; the git stages stay near one cell each, so a rare
  # one-cell shift on the bar line is rounding, not a content change.
  build-regular:
    kind: cli
    env: widget-build
    # debaser's live view redraws in place (erase to end of line), which the
    # capture renderer turns into wide blank runs (tools/guide/capture/render_cli.py
    # logical_lines). The image's `debaser` is therefore a wrapper
    # (visuals/bin/debaser): on a terminal it runs the real binary in a tmux pane of
    # the capture width and prints the pane's final screen with its colors, so the
    # visual shows what the terminal shows when the run ends.
    command: debaser build --trust-recipe
    exit: 0
    masks:
      # Run ids (report directories, yyyymmdd-hhmmss) before commit ids, which they would match.
      - {pattern: "\\b\\d{8}-\\d{6}(-\\d+)?\\b", replacement: "20260105-090000"}
      - {pattern: "\\b\\d+:\\d\\d(:\\d\\d)?\\b", replacement: "0:01"}
      - {pattern: "\\b\\d+(\\.\\d+)?(ms|s|m|h)\\b", replacement: "1s"}
      - {pattern: "\\d{4}-\\d{2}-\\d{2}", replacement: "2026-01-05"}
      # Commit ids; the lookahead keeps the masked run id above intact.
      - {pattern: "\\b(?!\\d{8}-\\d{6}\\b)[0-9a-f]{7,40}\\b", replacement: "0000000"}

  # status reads only what was fetched (debaser:src/cli/commands/status.ts:66-74);
  # the seed of `widget` fetches the new upstream commit, so it shows one.
  # No PR patches, so gh (absent from the image) is never asked
  # (status.ts:115 asks only for PR sources).
  status:
    kind: cli
    env: widget
    command: debaser status
    exit: 0
    # The patch table is about 115 columns wide (the fork branch's name sets
    # the first column); at 100 columns it would wrap.
    width: 120
    masks:
      - {pattern: "\\b\\d{8}-\\d{6}(-\\d+)?\\b", replacement: "20260105-090000"}
      - {pattern: "\\b\\d+:\\d\\d(:\\d\\d)?\\b", replacement: "0:01"}
      - {pattern: "\\b\\d+(\\.\\d+)?(ms|s|m|h)\\b", replacement: "1s"}
      - {pattern: "\\d{4}-\\d{2}-\\d{2}", replacement: "2026-01-05"}
      - {pattern: "\\b(?!\\d{8}-\\d{6}\\b)[0-9a-f]{7,40}\\b", replacement: "0000000"}
      # The container's home and temporary paths.
      - {pattern: "/root(?=/|\\b)", replacement: "~"}
      - {pattern: "/tmp/[^\\s:;,)]+", replacement: "/tmp/widget"}

  # The effective recipe with each value's layer (debaser:src/views/recipe.ts:4-54):
  # the project's committed recipe at the fetched upstream tip, then the local
  # override in the data directory, which adds smoke after test.
  recipe:
    kind: cli
    env: widget
    command: debaser recipe
    exit: 0
    # The layers line is about 102 columns wide; at 100 it would wrap.
    width: 110
    masks:
      # The upstream commit in `at upstream <sha7>` and `repo:...@<sha7>`.
      - {pattern: "\\b[0-9a-f]{7,40}\\b", replacement: "0000000"}
