# Per-page content rules, checked by `make check` (tools/guide/check.py).
# Each rule applies to the files matching `glob` (relative to the guide project root):
#   require:        every regex must match somewhere in each file
#   forbid:         no regex may match anywhere in each file
#   require_order:  the first matches of these regexes must appear in this order
# Page tasks add rules for their page before writing it, so the check fails first.
rules:
  - glob: content/modules/ROOT/pages/index.adoc
    require:
      - 'include::(ROOT:)?partial\$baseline-note\.adoc\[\]'
      - 'xref:user/index\.adoc'
      - 'xref:recipe-author/index\.adoc'
      - 'image::build-pipeline\.svg'
    require_order:
      - 'xref:user/index\.adoc'
      - 'xref:recipe-author/index\.adoc'
  - glob: content/modules/ROOT/pages/**/*.adoc
    forbid:
      - 'debaser rebuild'
      - 'steps\.replace'
      - 'releases/download'
      - 'brew install'
  - glob: content/modules/ROOT/pages/overview/how-it-works.adoc
    require:
      - 'image::build-pipeline\.svg'
      - 'visuals/build-regular\.svg'
      - 'xref:user/stops\.adoc'
    require_order:
      - '[Ff]etch'
      - '[Mm]erge'
      - '[Aa]cceptance'
      - '[Ii]nstall'
  - glob: content/modules/ROOT/pages/overview/concepts.adoc
    require:
      - 'image::where-things-live\.svg'
      - 'integration branch'
      - 'build directory'
      - 'patch list'
      - 'acceptance check'
  - glob: content/modules/ROOT/pages/user/index.adoc
    require:
      - 'xref:user/install\.adoc'
      - 'xref:user/first-build\.adoc'
      - 'xref:user/stops\.adoc'
  - glob: content/modules/ROOT/pages/recipe-author/index.adoc
    require:
      - 'xref:recipe-author/recipes\.adoc'
      - 'xref:recipe-author/harness\.adoc'
  - glob: content/modules/ROOT/pages/user/install.adoc
    require:
      - '^Check:'
      - 'bun run build'
      - '\{debaser-git-min\}'
      - '\{debaser-version\}'
    require_order:
      - 'git clone'
      - 'bun install'
      - 'bun run build'
      - 'debaser --version'
  - glob: content/modules/ROOT/pages/user/first-build.adoc
    require:
      - '^Check:'
      - 'visuals/build-regular\.svg'
      - '--upstream'
    require_order:
      - 'git remote add upstream'
      - 'debaser add'
      - 'debaser build'
      - 'debaser status'
  - glob: content/modules/ROOT/pages/user/patch-list.adoc
    require:
      - '--pin'
      - '--reason'
      - 'list --verbose'
      - 'DEBASER_DIR'
  - glob: content/modules/ROOT/pages/user/build-directory.adoc
    require:
      - 'image::where-things-live\.svg'
      - '"tree"'
      - 'git switch'
  - glob: content/modules/ROOT/pages/user/stops.adoc
    require:
      - 'visuals/build-stopped-conflict\.svg'
      - 'debaser continue'
      - 'debaser rollback'
      - 'visual:build-stopped-conflict'
    require_order:
      - '^=== Exit 2:'
      - '^=== Exit 3:'
      - '^=== Exit 4:'
      - '^=== Exit 5:'
      - '^=== Exit 6:'
      - '^=== Exits 129, 130, and 143:'
  - glob: content/modules/ROOT/pages/user/status.adoc
    require:
      - 'visuals/status\.svg'
      - '--fetch'
      - 'PATCH CHECK'
  - glob: content/modules/ROOT/pages/user/own-branches.adoc
    require:
      - '--in-worktree'
      - '--rebase'
      - 'conflicting'
      - '--skip-branch'
  - glob: content/modules/ROOT/pages/user/headless.adoc
    require:
      - '--json'
      - '--trust-recipe'
      - '--push'
      - 'result\.json'
  - glob: content/modules/ROOT/pages/recipe-author/recipes.adoc
    require:
      - 'visuals/recipe\.svg'
      - '\.debaser/recipe\.toml'
      - 'debaser trust'
      - 'debaser recipe'
  - glob: content/modules/ROOT/pages/recipe-author/steps.adoc
    require:
      - 'steps_replace'
      - '\{output\}'
      - '\{tests\}'
      - 'after_build'
      - 'DEBASER_PATCHES'
  - glob: content/modules/ROOT/pages/recipe-author/acceptance-checks.adoc
    require:
      - 'DEBASER_ARTIFACT'
      - '"match"'
      - '"timeout"'
      - 'PATCH CHECK'
  - glob: content/modules/ROOT/pages/recipe-author/harness.adoc
    require:
      - '\{prompt_file\}'
      - 'timeoutSeconds'
      - 'attempts'
      - '"kind"'
      - 'plain'
  - glob: content/modules/ROOT/pages/recipe-author/harness-verification.adoc
    require:
      - 'Resolved-By: harness'
      - 'Fixed-By: harness'
      - 'DEBASER_TASK'
      - 'rebase_conflict'
  - glob: content/modules/ROOT/pages/reference/commands.adoc
    require:
      - '\badd\b'
      - '\bremove\b'
      - '\blist\b'
      - '\bbuild\b'
      - '\brebase\b'
      - '\bcontinue\b'
      - '\brollback\b'
      - '\bstatus\b'
      - '\brecipe\b'
      - '\btrust\b'
      - '--dir'
  - glob: content/modules/ROOT/pages/reference/patches-json.adoc
    require:
      - 'upstream\.repo'
      - '"rebase"'
      - '"tree"'
      - '"harness"'
      - '"retired"'
      - '"acceptance"'
